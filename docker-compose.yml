version: '3.8'

services:
  phonics-guide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phonics-guide-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    networks:
      - phonics-network

networks:
  phonics-network:
    driver: bridge
